<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Max-OS</title>
		<link rel="icon" href="favicon.ico" type="image/x-icon" />
		<style>
			body,
			html {
				margin: 0;
				padding: 0;
				overflow: hidden;
				background-color: black;

				width: 100%;
				height: 100%;
				display: flex;
				justify-content: center;
				align-items: center;

				animation: darkPulse 10s ease-in-out infinite alternate;
			}

			@keyframes darkPulse {
				0% {
					background-color: #000000;
				}
				100% {
					background-color: #0a0a0a;
				}
			}

			canvas {
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<script src="./out/boot.js" defer></script>
	</body>
</html>
